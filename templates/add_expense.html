{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Add New Expense</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label for="id_expense_place" class="form-label">Place:</label>
                            {{ form.expense_place }}
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Transaction Details:</label>
                            <div class="row">
                                <div class="col-md-4">
                                    {{ form.transaction_type }}
                                </div>
                                <div class="col-md-8">
                                    <div class="input-group">
                                        <span class="input-group-text">&#x20b9;</span>
                                        {{ form.expense_amount }}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4 d-flex justify-content-between">
                            <a href="{% url 'expense_list' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Save Expense</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
