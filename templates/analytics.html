{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
<h2 class="mb-3">Monthly Debit, Credit & Net</h2>
<canvas id="expenseChart" width="400" height="200"></canvas>

{{ chart_labels|json_script:"chart-labels" }}
{{ debit_data|json_script:"debit-data" }}
{{ credit_data|json_script:"credit-data" }}
{{ net_data|json_script:"net-data" }}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const labels = JSON.parse(document.getElementById('chart-labels').textContent);
    const debitData = JSON.parse(document.getElementById('debit-data').textContent);
    const creditData = JSON.parse(document.getElementById('credit-data').textContent);
    const netData = JSON.parse(document.getElementById('net-data').textContent);

    const ctx = document.getElementById('expenseChart').getContext('2d');
    const expenseChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Debits (-)',
                    data: debitData,
                    borderColor: 'rgba(255, 99, 132, 1)',
                    backgroundColor: 'rgba(255, 99, 132, 0.3)',
                    borderWidth: 2,
                    fill: true
                },
                {
                    label: 'Credits (+)',
                    data: creditData,
                    borderColor: 'rgba(75, 192, 192, 1)',
                    backgroundColor: 'rgba(75, 192, 192, 0.3)',
                    borderWidth: 2,
                    fill: true
                },
                {
                    label: 'Net (Credit - Debit)',
                    data: netData,
                    borderColor: 'rgba(54, 162, 235, 1)',
                    backgroundColor: 'rgba(54, 162, 235, 0.3)',
                    borderWidth: 2,
                    fill: false
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    title: { display: true, text: 'Amount (?)' }
                },
                x: {
                    title: { display: true, text: 'Month' }
                }
            }
        }
    });
</script>

</div>
{% endblock %}
